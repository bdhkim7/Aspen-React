version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx playwright install --with-deps chromium
    build:
      commands:
        - npm run build
        # Smoke tests gate deploy: failure here stops Amplify from publishing
        - npm run test:e2e:ci
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - .cache/ms-playwright/**/*
