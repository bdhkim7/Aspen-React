version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Amplify = Amazon Linux 2023 (dnf). Playwright --with-deps needs apt-get (Ubuntu only).
        - sudo dnf install -y libXcomposite libXcursor libXdamage libXext libXi libXtst cups-libs libXScrnSaver libXrandr gtk3 pango alsa-lib atk at-spi2-atk at-spi2-core libdrm libxkbcommon nss xorg-x11-server-Xvfb libgbm
        - npx playwright install chromium
    build:
      commands:
        - npm run build
        # Smoke tests gate deploy: failure here stops Amplify from publishing
        - npm run test:e2e:ci
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - .cache/ms-playwright/**/*
